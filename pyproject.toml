[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "spinifex_gnss"
authors = [
    {name="Maaijke Mevius"},
    {name="Tammo Jan Dijkema"},
    {name="Alec Thomson"},
]
description = "Correcting ionospheric Faraday rotation."
readme = "README.md"
license.file = "LICENSE"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "astropy>=6",
    "h5py",
    "ppigrf",
    "PyIRI",
    "requests",
    "unlzw3",
    "typing-extensions; python_version < '3.10'",
    "nest-asyncio",
    "pydantic>=2.10.6",
    "eval-type-backport",
]

[project.optional-dependencies]
test = ["pytest >=6", "pytest-cov >=3", "pytest-asyncio", "nbconvert", "jupyter"]
dev = ["pytest >=6", "pytest-cov >=3", "tox-uv", "pre-commit", "ruff", "mypy", "pytest-asyncio", "nbconvert"]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "spinifex_gnss/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["spinifex_gnss"]
include = [
  "spinifex_gnss/data/**"
]

[tool.hatch.build.targets.sdist]
packages = ["spinifex_gnss"]
include = [
  "spinifex_gnss/data/**"
]

[[tool.mypy.overrides]]
module = "spinifex_gnss.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["astropy.*", "requests", "casacore.*", "unlzw3.*", "ppigrf.*", "PyIRI.*"]
ignore_missing_imports = true



[tool.ruff]
src = ["spinifex_gnss"]

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "I",   # isort
    "ARG", # flake8-unused-arguments
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "EXE", # flake8-executable
    "NPY", # NumPy specific rules
    "PD",  # pandas-vet,
    "RET", # flake8-return
]
ignore = [
    "PLR09",   # Too many <...>
    "PLR2004", # Magic value used in comparison
    "ISC001",  # Conflicts with formatter
]
isort.required-imports = ["from __future__ import annotations"]
# Uncomment if using a _compat.typing backport
# typing-modules = ["spinifex._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "E402"]
"docs/examples/*" = ["T20", "E402", "T201"]
"docs/examples/*.ipynb" = ["T20", "E402", "T201"]
"*.ipynb" = ["T20", "E402", "T201"]
